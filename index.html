<!DOCTYPE html>
<html lang="uz">
<head>

<style>
  :root{
    --navy:#1F3864; --navy-dark:#152A4A; --gold:#BF9000;
    --cream:#FBF9F4; --paper:#FFFFFF; --line:#E4DFD3;
    --ink:#26241D; --muted:#8A8474; --yellow:#FFF6D8; --red:#7A2E2E;
    --green:#2E6B34; --blue:#2A5B8A; --teal:#1E6B62;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; font-family:'Georgia','Times New Roman',serif;
    background:var(--cream); color:var(--ink);
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  header{
    background:var(--navy); color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    position:sticky; top:0; z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    display:flex; align-items:center; gap:10px;
  }
  header .back{
    background:none; border:1px solid rgba(255,255,255,.4); color:#fff;
    border-radius:8px; font-size:15px; padding:6px 12px; cursor:pointer;
    font-family:Arial,sans-serif; display:none;
  }
  header .htext{ flex:1; min-width:0; }
  header h1{ margin:0; font-size:17px; letter-spacing:.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header p{ margin:2px 0 0; font-size:11px; color:#C9D3E4; font-family:Arial,sans-serif; font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wrap{ padding:14px 14px 20px; max-width:640px; margin:0 auto; }
  .panel{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .panel h2{
    font-size:12.5px; text-transform:uppercase; letter-spacing:1px; color:var(--navy);
    margin:0 0 10px; font-family:Arial,sans-serif; font-weight:700;
    border-bottom:2px solid var(--gold); padding-bottom:6px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .field{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .field:last-child{ border-bottom:none; }
  .field label{ font-size:13px; font-family:Arial,sans-serif; flex:1; }
  input, select, textarea{
    padding:8px 10px; border:1px solid #cfc8b4; border-radius:6px;
    background:var(--yellow); font-size:15px; font-family:Arial,sans-serif; color:var(--ink);
  }
  input[type=number]{ width:130px; text-align:right; }
  input[type=text], input[type=date], input[type=tel]{ width:170px; }
  select{ width:170px; }
  textarea{ width:100%; min-height:52px; resize:vertical; font-size:13.5px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--navy); outline-offset:1px; }
  .mini-field label{ display:block; font-size:11px; font-family:Arial,sans-serif; color:var(--muted); margin-bottom:3px; }
  .mini-field input, .mini-field select{ width:100%; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px 10px; }
  .sub-label{ font-size:10.5px; font-family:Arial,sans-serif; color:var(--gold); text-transform:uppercase; letter-spacing:.5px; margin:12px 0 6px; font-weight:700; }
  /* room card */
  .room-card{ background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .room-card .top-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .room-card .top-row input[type=text]{ flex:1; width:auto; font-weight:700; }
  .room-index{ background:var(--navy); color:#fff; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-family:Arial,sans-serif; font-weight:700; flex-shrink:0; }
  .del-btn{ background:none; border:none; color:#b04a4a; font-size:18px; cursor:pointer; padding:2px 6px; line-height:1; }
  .room-result{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:flex; justify-content:space-between; align-items:center; font-family:Arial,sans-serif; font-size:13px; gap:8px; }
  .room-result .sum{ font-weight:700; color:var(--navy); font-size:15px; white-space:nowrap; }
  .badge-double{ display:inline-block; background:var(--gold); color:#fff; font-size:10px; font-family:Arial,sans-serif; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:6px; }
  /* buttons */
  .add-btn{ width:100%; padding:12px; background:#fff; border:2px dashed var(--navy); color:var(--navy); border-radius:10px; font-family:Arial,sans-serif; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:14px; }
  .add-btn:active{ background:var(--cream); }
  .btn{ padding:12px 10px; border-radius:10px; font-family:Arial,sans-serif; font-weight:700; font-size:13px; cursor:pointer; border:1px solid var(--navy); background:var(--navy); color:#fff; }
  .btn.secondary{ background:#fff; color:var(--navy); }
  .btn.danger{ background:#fff; color:var(--red); border-color:var(--red); }
  .btn-row{ display:flex; gap:8px; margin-bottom:14px; }
  .btn-row .btn{ flex:1; }
  /* summary */
  .summary-row{ display:flex; justify-content:space-between; padding:6px 0; font-family:Arial,sans-serif; font-size:13.5px; }
  .summary-row.final{ border-top:2px solid var(--gold); margin-top:6px; padding-top:10px; font-size:16px; font-weight:700; color:var(--navy); }
  .summary-row.debt .val{ color:var(--red); font-weight:700; }
  .summary-row.paid .val{ color:var(--green); }
  .summary-row.discount .val{ color:var(--red); }
  /* order list */
  .order-item{ background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .order-item:active{ background:var(--cream); }
  .order-item .row1{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; }
  .order-item .name{ font-weight:700; font-size:15px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .order-item .row2{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:Arial,sans-serif; font-size:12.5px; color:var(--muted); }
  .order-item .money{ font-family:Arial,sans-serif; font-size:13px; margin-top:6px; display:flex; justify-content:space-between; }
  .order-item .money .debt{ color:var(--red); font-weight:700; }
  .order-item .money .ok{ color:var(--green); font-weight:700; }
  .status-badge{ display:inline-block; font-size:10.5px; font-family:Arial,sans-serif; font-weight:700; padding:3px 8px; border-radius:10px; color:#fff; white-space:nowrap; }
  .search-box{ width:100%; margin-bottom:12px; }
  .search-box input{ width:100%; }
  .empty{ text-align:center; color:var(--muted); font-family:Arial,sans-serif; font-size:13.5px; padding:34px 10px; font-style:italic; line-height:1.6; }
  /* payments */
  .pay-item{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line); font-family:Arial,sans-serif; font-size:13px; }
  .pay-item .sum{ font-weight:700; color:var(--green); white-space:nowrap; }
  .pay-add{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .pay-add .full{ grid-column:1 / -1; }
  /* report */
  .rep-table{ width:100%; border-collapse:collapse; font-family:Arial,sans-serif; font-size:12.5px; }
  .rep-table th{ text-align:right; padding:7px 6px; border-bottom:2px solid var(--gold); color:var(--navy); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .rep-table th:first-child{ text-align:left; }
  .rep-table td{ padding:7px 6px; border-bottom:1px dashed var(--line); text-align:right; white-space:nowrap; }
  .rep-table td:first-child{ text-align:left; }
  .rep-table tr.total td{ border-top:2px solid var(--gold); border-bottom:none; font-weight:700; color:var(--navy); }
  .chips{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .chip{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 14px; flex:1; min-width:130px; }
  .chip .cl{ font-size:11px; font-family:Arial,sans-serif; color:var(--muted); }
  .chip .cv{ font-size:17px; font-family:Arial,sans-serif; font-weight:700; color:var(--navy); margin-top:2px; }
  .chip .cv.red{ color:var(--red); }
  .note{ font-size:11px; color:var(--muted); font-family:Arial,sans-serif; font-style:italic; line-height:1.5; padding:0 2px; }
  /* bottom nav */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:var(--navy); display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -3px 10px rgba(0,0,0,.2);
  }
  .bottom-nav button{
    flex:1; background:none; border:none; color:#9FB0CC; padding:10px 4px 12px;
    font-family:Arial,sans-serif; font-size:11px; font-weight:700; cursor:pointer;
  }
  .bottom-nav button .ic{ display:block; font-size:20px; margin-bottom:2px; }
  .bottom-nav button.active{ color:var(--gold); }
  .toast{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:var(--navy-dark); color:#fff; padding:10px 18px; border-radius:8px;
    font-family:Arial,sans-serif; font-size:13px; z-index:100; opacity:0; transition:opacity .3s; pointer-events:none;
    max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; }
  details.prices-det{ font-family:Arial,sans-serif; }
  details.prices-det summary{ cursor:pointer; font-size:12.5px; color:var(--navy); font-weight:700; padding:4px 0; }
  .pdf-host{ position:fixed; left:-12000px; top:0; }
  /* PDF sheet (A4 794px @96dpi) */
  .sheet{ width:794px; background:#fff; color:#26241D; font-family:Arial,Helvetica,sans-serif; padding:0 0 30px; }
  .sheet .shead{ background:#1F3864; color:#fff; padding:26px 40px 20px; display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
  .sheet .shead .contact{ text-align:right; font-size:13.5px; line-height:1.75; color:#E8EDF5; white-space:nowrap; }
  .sheet .shead .contact b{ color:#E7B93C; }
  .sheet .shead .brand{ font-size:26px; font-weight:800; letter-spacing:2px; }
  .sheet .shead .brand span{ color:#E7B93C; }
  .sheet .shead .tag{ font-size:12px; color:#C9D3E4; font-style:italic; margin-top:4px; }
  .sheet .gline{ height:5px; background:#BF9000; }
  .sheet .sbody{ padding:24px 40px 0; }
  .sheet h3{ font-size:14px; color:#1F3864; margin:0 0 10px; text-transform:uppercase; letter-spacing:1px; border-bottom:2px solid #BF9000; padding-bottom:5px; }
  .sheet .info{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:20px; }
  .sheet .info td{ padding:5px 8px 5px 0; vertical-align:top; }
  .sheet .info td.k{ color:#8A8474; width:150px; }
  .sheet table.items{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:6px; }
  .sheet table.items th{ background:#1F3864; color:#fff; padding:8px 8px; font-size:11px; text-align:left; }
  .sheet table.items th.r, .sheet table.items td.r{ text-align:right; white-space:nowrap; }
  .sheet table.items td{ padding:8px 8px; border-bottom:1px solid #E4DFD3; vertical-align:top; }
  .sheet .rname{ font-weight:700; }
  .sheet .rdet{ color:#6b675c; font-size:11.5px; margin-top:3px; line-height:1.45; }
  .sheet .totals{ width:100%; font-size:13px; margin-top:12px; }
  .sheet .totals .trow{ display:flex; justify-content:flex-end; gap:30px; padding:4px 8px; }
  .sheet .totals .trow .tk{ color:#52514e; min-width:200px; text-align:right; }
  .sheet .totals .trow .tv{ min-width:150px; text-align:right; font-weight:700; }
  .sheet .totals .trow.big{ border-top:2px solid #BF9000; margin-top:6px; padding-top:9px; font-size:16px; color:#1F3864; }
  .sheet .totals .trow.debt .tv{ color:#7A2E2E; }
  .sheet .totals .trow.paid .tv{ color:#2E6B34; }
  .sheet .pays{ width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .sheet .pays td{ padding:5px 8px; border-bottom:1px dashed #E4DFD3; }
  .sheet .pays td.r{ text-align:right; font-weight:700; color:#2E6B34; }
  .sheet .sfoot{ margin-top:26px; padding:16px 40px 0; border-top:1px solid #E4DFD3; display:flex; justify-content:space-between; font-size:11.5px; color:#8A8474; }
</style>
</head>
<body>
<header id="hdr">
  <button class="back" id="backBtn" onclick="goBack()">‹ Orqaga</button>
  <div class="htext">
    <h1 id="hTitle">DORMON DOORS</h1>
    <p id="hSub">MDF eshik — zakazlar va hisob-kitob</p>
  </div>
</header>
<div class="wrap" id="app"></div>
<nav class="bottom-nav" id="bottomNav">
  <button id="nav_list" onclick="show('list')"><span class="ic">📋</span>Zakazlar</button>
  <button id="nav_report" onclick="show('report')"><span class="ic">📊</span>Hisobot</button>
  <button id="nav_settings" onclick="show('settings')"><span class="ic">⚙️</span>Sozlamalar</button>
</nav>
<div class="toast" id="toast"></div>
<div class="pdf-host" id="pdfHost"></div>
<script>
/* =================== HOLAT (STATE) =================== */
const KEY = 'dormon_doors_v3';
const APP_VER = 'v3.2 — 02.08.2026';
const STATUSES = ['Kelishuv','Avans olindi','Ishlab chiqarilmoqda',"O'rnatildi",'Yakunlandi','Bekor qilindi'];
const ST_COLORS = {
  'Kelishuv':'#8A8474','Avans olindi':'#2A5B8A','Ishlab chiqarilmoqda':'#BF9000',
  "O'rnatildi":'#1E6B62','Yakunlandi':'#2E6B34','Bekor qilindi':'#7A2E2E'
};
const OYLAR = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const STORAGE_OK = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();

/* =================== RASM OMBORI (IndexedDB — katta hajm, matn omboriga tegmaydi) =================== */
const IDB_NAME='dormon_imgs', IDB_STORE='imgs';
function idbOpen(){ return new Promise(function(res,rej){
  const q=indexedDB.open(IDB_NAME,1);
  q.onupgradeneeded=function(){ q.result.createObjectStore(IDB_STORE); };
  q.onsuccess=function(){ res(q.result); };
  q.onerror=function(){ rej(q.error); };
});}
function idbPut(k,v){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
  const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,k);
  tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); };
});});}
function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){
  const tx=db.transaction(IDB_STORE,'readonly'); const r=tx.objectStore(IDB_STORE).get(k);
  r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ rej(r.error); };
});});}
function idbDel(k){ return idbOpen().then(function(db){ return new Promise(function(res){
  const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(k);
  tx.oncomplete=function(){ res(); }; tx.onerror=function(){ res(); };
});});}

/* =================== DOLLAR KURSI (FINANS ilovasi bilan umumiy) =================== */
const KURS_KEY = 'dormon_kurs_v1';
function loadKurs(){
  try{ const r = localStorage.getItem(KURS_KEY); const k = r ? JSON.parse(r) : null;
    return (k && typeof k.rate!=='undefined') ? k : { rate:0, date:'', src:'Hamkorbank — sotib olish' };
  }catch(e){ return { rate:0, date:'', src:'Hamkorbank — sotib olish' }; }
}
function saveKurs(){ try{ localStorage.setItem(KURS_KEY, JSON.stringify(KURS)); }catch(e){} }
let KURS = loadKurs();
function kursKunlar(){
  if(!KURS.date) return 0;
  return Math.max(0, Math.round((new Date(todayStr()) - new Date(KURS.date))/86400000));
}
function kursHolat(){
  if(!(KURS.rate>0)) return 'yoq';
  return (KURS.date === todayStr()) ? 'ok' : 'eski';
}
function kursWarnHTML(){
  const h = kursHolat();
  const st = 'background:#FFF0E0;border:1px solid #E0B080;color:#7A4A1E;border-radius:8px;padding:10px 12px;font-family:Arial,sans-serif;font-size:12.5px;margin-bottom:12px';
  if(h==='yoq') return `<div style="${st}">💵 <b>Dollar kursi kiritilmagan.</b> Sozlamalar → «Dollar kursi».</div>`;
  if(h==='eski') return `<div style="${st}">💵 Kurs <b>${kursKunlar()} kun</b> oldin yangilangan (${fmtDate(KURS.date)}): 1 $ = ${fmt(KURS.rate)} so'm. Bugungisini tekshiring.</div>`;
  return '';
}
function kursSaqla(){
  const raw = document.getElementById('kursInp').value;
  const v = Number(String(raw).replace(/[^\d]/g,'')) || 0;
  if(!(v>0)){ toast('Kursni kiriting'); return; }
  if(v<5000 || v>50000){ toast('Kurs shubhali: '+fmt(v)+' — tekshiring'); return; }
  KURS.rate=v; KURS.date=todayStr(); KURS.src='Hamkorbank — sotib olish';
  saveKurs(); toast("Kurs saqlandi: 1 $ = "+fmt(v)+" so'm"); renderSettings();
}

function defaultState(){
  return {
    seq: 0,
    settings: {
      phone: '',
      defKv: 1300000,      // 1 kv.m narxi (montaj va dostavka ICHIDA)
      defDw: 0.29,
      prices: { dabor:400000, naichnik:70000, dastak:150000, petlya:40000, qulf:300000, shpingalet:0 }
    },
    orders: []
  };
}
function load(){
  if(!STORAGE_OK) return null;
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function save(){
  if(!STORAGE_OK) return;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ try{ toast("XOTIRA TO'LDI — saqlanmadi! Rasmlarni o'chiring"); }catch(_){} }
}
let S = load() || defaultState();
/* v3.1 migratsiya: shpingalet narxi va telefon raqamlar */
const DEFAULT_PHONE = '+998 91 488 70 47, +998 94 094 07 00';
if(S.settings.prices.shpingalet === undefined) S.settings.prices.shpingalet = 0;
if(!S.settings.phone) S.settings.phone = DEFAULT_PHONE;
S.orders.forEach(o => {
  if(o.prices && o.prices.shpingalet === undefined) o.prices.shpingalet = 0;
  if(o.kurs === undefined) o.kurs = 0;
  if(o.kursDate === undefined) o.kursDate = '';
  if(o.deadline === undefined) o.deadline = '';
  if(o.deliveredDate === undefined) o.deliveredDate = '';
  (o.payments||[]).forEach(pm=>{ if(pm.method===undefined) pm.method='Naqd'; });
  (o.rooms||[]).forEach(r=>{
    if(r.type===undefined) r.type='eshik';
    if(r.leaf===undefined) r.leaf=1;
    if(r.imgKey===undefined) r.imgKey='';
    if(r.img && String(r.img).indexOf('data:')===0){
      const k='o'+o.id+'_r'+r.id;
      try{ idbPut(k, r.img); }catch(e){}
      r.imgKey=k; r.img='';
    }
  });
});
save();

/* =================== YORDAMCHI =================== */
function fmt(n){ if(isNaN(n)||n===null) n=0; return Math.round(n).toLocaleString('ru-RU').replace(/,/g,' '); }
function fmtQty(n){ if(n==null||isNaN(n)) n=0; return String(Math.round(n*100)/100).replace('.',','); }
function fmtUsd(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  const i = Math.floor(n), c = Math.round((n-i)*100);
  const istr = i.toLocaleString('ru-RU').replace(/[,  ]/g,' ');
  return (neg?'−':'') + istr + (c ? (','+String(c).padStart(2,'0')) : '');
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : iso; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
function getOrder(id){ return S.orders.find(o=>o.id===id); }

/* =================== HISOB =================== */
const RTYPES = {
  eshik:    {n:'Eshik (MDF)',      m:'kvm',  u:'dona'},
  obshivka: {n:'Devor obshivkasi', m:'kvm',  u:'dona'},
  shkaf:    {n:'Shkaf / kuxnya',   m:'kvm',  u:'dona'},
  plintus:  {n:'Plintus',          m:'unit', u:'metr'},
  lestnitsa:{n:'Zina (lestnitsa)', m:'unit', u:"pog'ona"},
  balasina: {n:'Balasina',         m:'unit', u:'dona'},
  mebel:    {n:'Boshqa buyum',     m:'unit', u:'dona'}
};
function rType(r){ return RTYPES[r.type] ? r.type : 'eshik'; }
function calcRoom(r, p){
  const t=rType(r), T=RTYPES[t];
  const qty=parseFloat(r.qty)||0, kvNarx=parseFloat(r.kvNarx)||0;
  const comp=[], warns=[];
  let per=0, area=0, total=0;
  const tomon=(parseFloat(r.tomon)===1)?1:2;
  if(T.m==='kvm'){
    const h=parseFloat(r.h)||0, w=parseFloat(r.w)||0;
    area=h*w;
    if(!h || !w) warns.push("o'lcham (bo'yi/eni) kiritilmagan");
    if(!kvNarx) warns.push('1 kv.m narxi 0');
    const eshikSum=area*kvNarx;
    comp.push({k:(t==='eshik'?'Eshik':T.n), det:fmtQty(area)+' kv.m × '+fmt(kvNarx), sum:eshikSum});
    per=eshikSum;
    if(t==='eshik'){
      const dw=parseFloat(r.dw)||0;
      if(dw>0.09){
        const daborArea=(h*2+w)*Math.max(dw-0.09,0);
        const daborSum=daborArea*(p.dabor||0);
        comp.push({k:'Dobor', det:fmtQty(daborArea)+' kv.m × '+fmt(p.dabor||0), sum:daborSum});
        if(!p.dabor) warns.push('dobor narxi 0');
        per+=daborSum;
      }
      const naichLen=((h+0.12)*2+(w+0.25))*tomon;
      const naichSum=naichLen*(p.naichnik||0);
      comp.push({k:'Nalichnik '+tomon+' tomon', det:fmtQty(naichLen)+' m × '+fmt(p.naichnik||0), sum:naichSum});
      if(!p.naichnik) warns.push('nalichnik narxi 0');
      per+=naichSum;
      [['Dastak','dastakQty','dastak'],['Petlya','petlyaQty','petlya'],['Qulf','qulfQty','qulf'],['Shpingalet','shpingaletQty','shpingalet']].forEach(f=>{
        const q=parseFloat(r[f[1]])||0;
        if(q>0){
          const narx=p[f[2]]||0, sm=q*narx;
          comp.push({k:f[0], det:q+' dona × '+fmt(narx), sum:sm});
          if(!narx) warns.push(f[0].toLowerCase()+' narxi 0');
          per+=sm;
        }
      });
    }
    if(!qty) warns.push('soni 0');
    total=per*qty;
  } else {
    if(!qty) warns.push('miqdor kiritilmagan');
    if(!kvNarx) warns.push('birlik narxi 0');
    per=kvNarx;
    comp.push({k:T.n, det:fmtQty(qty)+' '+T.u+' × '+fmt(kvNarx), sum:qty*kvNarx});
    total=qty*kvNarx;
  }
  const isDouble=(t==='eshik') && (String(r.leaf)==='2');
  return { type:t, T, area, perDoor:per, total, isDouble, qty, tomon, comp, warns };
}
function orderPrices(o){ return o.prices || S.settings.prices; }
function calcOrder(o){
  const p=orderPrices(o);
  let subtotal=0;
  o.rooms.forEach(r=>{ subtotal+=calcRoom(r,p).total; });
  const dv=parseFloat(o.discountVal)||0;
  const discountSum=(o.discountType==='%') ? subtotal*dv/100 : dv;
  const final=Math.max(subtotal-discountSum,0);
  let paid=0;
  (o.payments||[]).forEach(pm=>{ paid+=parseFloat(pm.sum)||0; });
  return { subtotal, discountSum, final, paid, qoldiq: final-paid };
}

let searchQ='';
function renderList(){
  const app=document.getElementById('app');
  const orders=[...S.orders].sort((a,b)=>b.id-a.id);
  const q=searchQ.trim().toLowerCase();
  const filtered=q ? orders.filter(o=>
    (o.client.name||'').toLowerCase().includes(q) ||
    (o.client.phone||'').toLowerCase().includes(q) ||
    String(o.id)===q.replace('#','')
  ) : orders;
  let debtTotal=0, activeCount=0, lateCount=0;
  S.orders.forEach(o=>{
    if(o.status!=='Bekor qilindi'){
      const c=calcOrder(o);
      if(c.qoldiq>0) debtTotal+=c.qoldiq;
      if(o.status!=='Yakunlandi') activeCount++;
      if(!o.deliveredDate && o.deadline && o.deadline<todayStr()) lateCount++;
    }
  });

  html+=`<div class="chips">

  html+=`<button class="add-btn" onclick="newOrder()">+ Yangi zakaz ochish</button>`;

  app.innerHTML=html;

function upRoomLeaf(oid,rid,v){ const o=getOrder(oid); if(!o)return; const r=o.rooms.find(x=>x.id===rid); if(!r)return; r.leaf=v; save(); renderOrder(); }
function roomImg(oid,rid,inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    const img=new Image();
    img.onload=function(){
      const c=document.createElement('canvas');
      const MAX=1200, k=Math.min(1, MAX/Math.max(img.width,img.height));
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let d=c.toDataURL('image/jpeg',0.8);
      if(d.length>450000) d=c.toDataURL('image/jpeg',0.6);
      if(d.length>900000) d=c.toDataURL('image/jpeg',0.45);
      const o=getOrder(oid); const r=o&&o.rooms.find(x=>x.id===rid); if(!r) return;
      const key='o'+oid+'_r'+rid;
      idbPut(key,d).then(function(){
        r.imgKey=key; r.img=''; save(); renderOrder(); toast('Rasm saqlandi');
      }).catch(function(){ toast('Rasm saqlanmadi — qurilma xotirasini tekshiring'); });
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
  inp.value='';
}
function delRoomImg(oid,rid){ const o=getOrder(oid); if(!o)return; const r=o.rooms.find(x=>x.id===rid); if(!r)return; if(r.imgKey){ try{ idbDel(r.imgKey); }catch(e){} } r.imgKey=''; r.img=''; save(); renderOrder(); }
function deadlineInfo(o){
  if(o.status==='Bekor qilindi') return null;
  if(o.deliveredDate) return {c:'var(--green)', t:'✅ Topshirilgan: '+fmtDate(o.deliveredDate)};
  if(!o.deadline) return null;
  const d=Math.round((new Date(o.deadline)-new Date(todayStr()))/86400000);
  if(d<0) return {c:'var(--red)', t:'⏰ Muddatdan '+(-d)+' kun o\'tdi ('+fmtDate(o.deadline)+')'};
  if(d===0) return {c:'#B07A1E', t:'⏳ Muddat BUGUN'};
  if(d<=3) return {c:'#B07A1E', t:'⏳ Muddatga '+d+' kun qoldi'};
  return {c:'var(--muted)', t:'Muddat: '+fmtDate(o.deadline)};
}
function checklistHTML(o){
  const c=calcOrder(o), p=orderPrices(o);
  const rows=[];
  const okM = !!((o.client.name||'').trim() && (o.client.phone||'').trim());
  rows.push([okM, okM ? ('Mijoz: '+esc(o.client.name)) : ((o.client.name||'').trim() ? 'Mijoz telefoni kiritilmagan' : 'Mijoz ismi kiritilmagan')]);
  let prodOk=true; const pm=[];
  if(!o.rooms.length){ prodOk=false; pm.push("Mahsulot qo'shilmagan"); }
  o.rooms.forEach((r,i)=>{ const cr=calcRoom(r,p); if(cr.warns.length){ prodOk=false; pm.push((i+1)+'-qator: '+cr.warns.join(', ')); } });
  rows.push([prodOk, prodOk ? "Mahsulot va narxlar to'liq" : pm.join(' · ')]);
  const okD = !!o.deadline;
  rows.push([okD, okD ? ('Muddat: '+fmtDate(o.deadline)) : 'Topshirish muddati kiritilmagan']);
  const okA = c.paid>0;
  rows.push([okA, okA ? ('Zaklad olingan: '+fmt(c.paid)+" so'm") : 'Zaklad (avans) hali olinmagan']);
  if(o.deliveredDate) rows.push([true, 'Topshirilgan: '+fmtDate(o.deliveredDate)]);
  else if(o.deadline && o.deadline<todayStr()) rows.push([false, "⏰ Muddatdan o'tdi — hali topshirilmagan"]);
  if(o.status==='Yakunlandi' && c.qoldiq>0.5) rows.push([false, 'Yakunlangan, lekin qarz qolgan: '+fmt(c.qoldiq)]);
  const allOk=rows.every(x=>x[0]);
  return `<div class="panel" style="border-left:5px solid ${allOk?'var(--green)':'#B07A1E'}"><h2>Zakaz holati nazorati ${allOk?'✓':''}</h2>`+

}
function payHint(oid){
  const o=getOrder(oid); if(!o) return;
  const cur=document.getElementById('pay_cur').value;
  const v=parseFloat(document.getElementById('pay_sum').value)||0;
  const k=parseFloat(o.kurs)||0;
  const lbl=document.getElementById('pay_sum_lbl');
  if(lbl) lbl.textContent = cur==='USD' ? 'Summa (dollar $)' : "Summa (so'm)";

  if(cur==='USD'){
    h.textContent = !k ? '⚠️ Bu zakazda kurs kiritilmagan' : (v ? ('$'+v+' = '+fmt(v*k)+" so'm (kurs "+fmt(k)+")") : '');

function addPayment(oid){
  const o=getOrder(oid); if(!o)return;
  const d=document.getElementById('pay_date').value||todayStr();
  const cur=document.getElementById('pay_cur').value;
  const raw=parseFloat(document.getElementById('pay_sum').value)||0;
  const k=parseFloat(o.kurs)||0;
  let s=raw, usd=null;
  if(cur==='USD'){
    if(!(k>0)){ toast("Avval shu zakazga dollar kursini kiriting"); return; }
    usd=raw; s=Math.round(raw*k);
  }
  const iz=document.getElementById('pay_izoh').value||'';
  const method=document.getElementById('pay_method')?document.getElementById('pay_method').value:'Naqd';
  if(s<=0){ toast("Summani kiriting"); return; }
  o.pseq=(o.pseq||0)+1;
  o.payments.push({id:o.pseq, date:d, sum:s, izoh:iz, cur:cur, usd:usd, kurs:(cur==='USD'?k:null), method:method});
  if(o.status==='Kelishuv') o.status='Avans olindi';
  save(); renderOrder(); toast("To'lov qo'shildi: "+fmt(s)+" so'm");
}

let repYear=null;
function renderReport(){
  const app=document.getElementById('app');
  const years=new Set();
  S.orders.forEach(o=>{ if(o.date) years.add(o.date.slice(0,4)); (o.payments||[]).forEach(pm=>{ if(pm.date) years.add(pm.date.slice(0,4)); }); });
  const curY=String(new Date().getFullYear());
  if(!years.size) years.add(curY);
  if(!repYear || !years.has(repYear)) repYear=years.has(curY)?curY:[...years].sort().pop();
  const yearsArr=[...years].sort().reverse();

  /* oylik hisob */
  let liveActive=0, liveLate=0;
  S.orders.forEach(o=>{ if(o.status!=='Bekor qilindi' && !o.deliveredDate){ liveActive++; if(o.deadline && o.deadline<todayStr()) liveLate++; } });
  const rows=[]; let ySavdo=0,yTushum=0,yCount=0,yTopsh=0;
  for(let m=1;m<=12;m++){
    const mm=String(m).padStart(2,'0');
    let savdo=0,count=0,tushum=0;
    S.orders.forEach(o=>{
      if(o.status!=='Bekor qilindi' && o.date && o.date.slice(0,7)===repYear+'-'+mm){
        savdo+=calcOrder(o).final; count++;
      }
      (o.payments||[]).forEach(pm=>{ if(pm.date && pm.date.slice(0,7)===repYear+'-'+mm) tushum+=parseFloat(pm.sum)||0; });
    });
    let topsh=0;
    S.orders.forEach(o=>{ if(o.deliveredDate && o.deliveredDate.slice(0,7)===repYear+'-'+mm) topsh++; });
    ySavdo+=savdo; yTushum+=tushum; yCount+=count; yTopsh+=topsh;
    rows.push({m,count,topsh,savdo,tushum});
  }
  /* qarzdorlar */
  const debtors=[];
  S.orders.forEach(o=>{
    if(o.status==='Bekor qilindi') return;
    const c=calcOrder(o);
    if(c.qoldiq>0.5) debtors.push({o,q:c.qoldiq});
  });
  debtors.sort((a,b)=>b.q-a.q);
  const debtSum=debtors.reduce((s,d)=>s+d.q,0);

  let html='';
  html+=`<div class="panel"><h2>Yil tanlang</h2>
    <div class="field"><label>Hisobot yili</label><select onchange="repYear=this.value; renderReport();">
      ${yearsArr.map(y=>`<option value="${y}" ${y===repYear?'selected':''}>${y}</option>`).join('')}
    </select></div></div>`;
  html+=`<div class="chips">
    <div class="chip"><div class="cl">${repYear} — zakazlar</div><div class="cv">${yCount} ta</div></div>
    <div class="chip"><div class="cl">${repYear} — savdo</div><div class="cv">${fmt(ySavdo)}</div></div>
    <div class="chip"><div class="cl">${repYear} — tushum (to'lovlar)</div><div class="cv">${fmt(yTushum)}</div></div>
    <div class="chip"><div class="cl">Hozir qo'lda (topshirilmagan)</div><div class="cv">${liveActive} ta</div></div>
    <div class="chip"><div class="cl">Muddati o'tgan</div><div class="cv ${liveLate?'red':''}">${liveLate} ta</div></div>
  </div>`;
  html+=`<div class="panel"><h2>${repYear} yil — oylar kesimida (so'm)</h2>
    <table class="rep-table">
      <tr><th>Oy</th><th>Olindi</th><th>Topshirildi</th><th>Savdo</th><th>Tushum</th></tr>
      ${rows.map(r=>`<tr><td>${OYLAR[r.m-1]}</td><td>${r.count||''}</td><td>${r.topsh||''}</td><td>${r.savdo?fmt(r.savdo):''}</td><td>${r.tushum?fmt(r.tushum):''}</td></tr>`).join('')}
      <tr class="total"><td>JAMI</td><td>${yCount}</td><td>${yTopsh}</td><td>${fmt(ySavdo)}</td><td>${fmt(yTushum)}</td></tr>
    </table>
    <p class="note">Olindi — o'sha oyda ochilgan zakazlar. Topshirildi — o'sha oyda topshirilganlar. Savdo — ochilgan zakazlarning yakuniy summasi. Tushum — amalda kiritilgan to'lovlar. Bekor qilinganlar kirmaydi.</p>
  </div>`;
  html+=`<div class="panel"><h2>Qarzdorlar (barcha yillar) — jami ${fmt(debtSum)} so'm</h2>`;
  if(!debtors.length) html+=`<p class="note">Qarzdor mijoz yo'q 🎉</p>`;
  else html+=debtors.map(d=>`<div class="pay-item" style="cursor:pointer" onclick="show('order',${d.o.id})">
      <span>№${d.o.id} · <b>${esc(d.o.client.name)||'Nomsiz'}</b>${d.o.client.phone?' · '+esc(d.o.client.phone):''}<br>
      <span style="color:var(--muted);font-size:11.5px">${fmtDate(d.o.date)} · ${esc(d.o.status)}</span></span>
      <span class="sum" style="color:var(--red)">${fmt(d.q)}</span>
    </div>`).join('');
  html+=`</div>`;
  html+=`<div class="btn-row"><button class="btn" onclick="claudeShare()">🤖 Claude tahlili — holatni yuborish</button></div>
  <p class="note">Bir bosishda zakazlar holati matn bo'lib chiqadi — Claude ilovasiga tashlang, tahlil va tavsiya oladi.</p>`;
  app.innerHTML=html;
}
function claudeReportText(){
  const t=todayStr();
  let act=0, late=0, dbt=0; const lateList=[];
  S.orders.forEach(o=>{ if(o.status==='Bekor qilindi') return;
    const c=calcOrder(o); if(c.qoldiq>0) dbt+=c.qoldiq;
    if(!o.deliveredDate){ act++; if(o.deadline&&o.deadline<t){ late++; lateList.push('№'+o.id+' '+(o.client.name||'—')+' ('+Math.round((new Date(t)-new Date(o.deadline))/86400000)+' kun kechikdi)'); } }
  });
  const y=String(new Date().getFullYear());
  let cnt=0,topsh=0,savdo=0,tush=0;
  S.orders.forEach(o=>{
    if(o.status!=='Bekor qilindi'&&o.date&&o.date.slice(0,4)===y){cnt++;savdo+=calcOrder(o).final;}
    if(o.deliveredDate&&o.deliveredDate.slice(0,4)===y) topsh++;
    (o.payments||[]).forEach(pm=>{ if(pm.date&&pm.date.slice(0,4)===y) tush+=Number(pm.sum)||0; });
  });
  return "📋 DORMON DOORS — zakazlar holati ("+fmtDate(t)+")\n"
   +"Qo'lda (topshirilmagan): "+act+" ta, muddati o'tgan: "+late+" ta\n"
   +(lateList.length?("Kechikkanlar: "+lateList.join('; ')+"\n"):"")
   +"Mijozlardagi qarz: "+fmt(dbt)+" so'm\n"
   +y+" yil: olindi "+cnt+" ta, topshirildi "+topsh+" ta, savdo "+fmt(savdo)+" so'm, tushum "+fmt(tush)+" so'm\n\n"
   +"Iltimos: holatga qisqa tahlil, qaysi zakazlarga birinchi e'tibor berish kerak, 3 ta amaliy tavsiya.";
}
async function claudeShare(){
  const txt=claudeReportText();
  try{ if(navigator.share){ await navigator.share({text:txt}); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(txt); toast("Hisobot nusxalandi — Claude ilovasiga tashlang"); }
  catch(e){ prompt('Nusxalang:', txt); }
}

☁️ <b>Google Disk avto-zaxira:</b> FINANS ilovasida Disk manzili kiritilgan bo'lsa, zakazlar matni ham HAR KUNI o'zi Diskka boradi (<b>dormon_zakaz_*.json</b>, rasmlarsiz). Oxirgi yuborilgan: <b>${(function(){try{const d=localStorage.getItem('dormon_zakaz_gdlast');return d?fmtDate(d):"hali yo'q";}catch(e){return '—';}})()}</b></p>
  </div>`;
  html+=`<p class="note" style="text-align:center">DORMON DOORS zakaz daftari · ${APP_VER}<br>Zakazlar: ${S.orders.length} ta · Saqlash: ${STORAGE_OK?'ishlayapti ✓':"ISHLAMAYAPTI — ilovani Safari orqali oching!"}</p>`;
  app.innerHTML=html;
}
async function backupExport(){
  try{
    const imgs={};
    for(const o of S.orders){ for(const r of (o.rooms||[])){ if(r.imgKey){ try{ const d=await idbGet(r.imgKey); if(d) imgs[r.imgKey]=d; }catch(e){} } } }
    const data=JSON.stringify({app:'dormon-zakaz', ver:5, state:S, imgs:imgs});
    const fname='dormon_backup_'+todayStr()+'.json';
    const blob=new Blob([data],{type:'application/json'});
    const file=new File([blob],fname,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fname});
      return;
    }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Zaxira fayl yuklab olindi');
  }catch(e){ if(e && e.name!=='AbortError') toast('Xatolik: '+e.message); }
}
function backupImport(inp){
  const f=inp.files && inp.files[0];
  if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const parsed=JSON.parse(rd.result);
      const st=(parsed && parsed.state) ? parsed.state : parsed;
      if(!st || !Array.isArray(st.orders) || !st.settings) throw new Error("Bu Dormon Doors zaxira fayli emas");
      S=st; save();
      if(parsed && parsed.imgs){ Object.keys(parsed.imgs).forEach(function(k){ try{ idbPut(k, parsed.imgs[k]); }catch(e){} }); }
      toast('Zaxira tiklandi: '+S.orders.length+' ta zakaz');
      show('list');
    }catch(e){ toast('Tiklab bo\'lmadi: '+e.message); }
  };
  rd.readAsText(f);
  inp.value='';
}

/* =================== PDF =================== */
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Yuklab bo\'lmadi: '+src));
    document.head.appendChild(s);
  });
}
let pdfLibsReady=false;
async function ensurePdfLibs(){
  if(pdfLibsReady) return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  pdfLibsReady=true;
}
function phonesHTML(){
  const raw = (S.settings.phone || DEFAULT_PHONE);
  return raw.split(/[,;]+/).map(s => esc(s.trim())).filter(Boolean).join('<br>');
}
function pdfSheetHTML(o, IMGS){

    if(rc.type==='eshik') detParts.push(rc.isDouble?"Qo'sh eshik (2 tavaqa)":'Bir qanotli');
    if(r.izoh) detParts.push(esc(r.izoh));
    const compHtml = rc.comp.map(cx=>`${esc(cx.k)}: ${cx.det} = <b>${fmt(cx.sum)}</b>`).join('<br>');
    const olcham = rc.T.m==='kvm' ? `${esc(r.h)||0}×${esc(r.w)||0} m<br>(${fmtQty(rc.area)} kv.m)` : `${fmtQty(parseFloat(r.qty)||0)} ${rc.T.u}`;
    const soni = rc.T.m==='kvm' ? (esc(r.qty)||0) : '—';
    rowsHtml+=`<tr>
      <td>${idx+1}</td>
      <td><div class="rname">${esc(r.name)||rc.T.n}</div>
          <div class="rdet">${detParts.join(' · ')}</div>
          <div class="rdet" style="margin-top:5px">${compHtml}</div>
          ${IMGS&&IMGS[r.id]?`<img src="${IMGS[r.id]}" style="width:150px;border-radius:6px;margin-top:6px;border:1px solid #E4DFD3">`:''}</td>
      <td class="r">${olcham}</td>
      <td class="r">${soni}</td>
      <td class="r">${fmt(rc.perDoor)}</td>
      <td class="r">${fmt(rc.total)}</td>

    paysHtml=`<h3 style="margin-top:22px">To'lovlar</h3><table class="pays">`+
      o.payments.map(pm=>`<tr><td>${fmtDate(pm.date)}</td><td>${pm.method?esc(pm.method):'Naqd'}${pm.izoh?' · '+esc(pm.izoh):''}${pm.cur==='USD'?(' ($'+fmtUsd(pm.usd)+' × '+fmt(pm.kurs)+')'):''}</td><td class="r">+${fmt(parseFloat(pm.sum)||0)} so'm</td></tr>`).join('')+
      `</table>`;
  }
  const discRow = c.discountSum>0 ? `<div class="trow"><div class="tk">Chegirma${o.discountType==='%'?' ('+esc(o.discountVal)+'%)':''}:</div><div class="tv" style="color:#7A2E2E">−${fmt(c.discountSum)} so'm</div></div>` : '';
  return `<div class="sheet" id="sheetEl">
    <div class="shead">
      <div>
        <div class="brand">DORMON <span>DOORS</span></div>
        <div class="tag">MDF eshiklar — ishlab chiqarish, yetkazib berish va o'rnatish</div>
      </div>
      <div class="contact"><b>Tel:</b><br>${phonesHTML()}</div>
    </div>
    <div class="gline"></div>
    <div class="sbody">
      <h3>Buyurtma №${o.id} — hisob-kitob</h3>
      <table class="info">
        <tr><td class="k">Mijoz:</td><td><b>${esc(o.client.name)||'—'}</b></td><td class="k">Sana:</td><td>${fmtDate(o.date)}</td></tr>
        <tr><td class="k">Telefon:</td><td>${esc(o.client.phone)||'—'}</td><td class="k">Holati:</td><td>${esc(o.status)}</td></tr>
        <tr><td class="k">Manzil:</td><td colspan="3">${esc(o.client.addr)||'—'}</td></tr>
        <tr><td class="k">Topshirish muddati:</td><td>${o.deadline?fmtDate(o.deadline):'—'}</td><td class="k">Topshirilgan:</td><td>${o.deliveredDate?fmtDate(o.deliveredDate):'—'}</td></tr>
      </table>
      <table class="items">
        <tr><th style="width:26px">№</th><th>Xona / tafsilot</th><th class="r">O'lcham</th><th class="r">Soni</th><th class="r">1 dona, so'm</th><th class="r">Summa, so'm</th></tr>
        ${rowsHtml}
      </table>
      <div class="totals">
        <div class="trow"><div class="tk">Jami:</div><div class="tv">${fmt(c.subtotal)} so'm</div></div>
        ${discRow}
        <div class="trow big"><div class="tk">YAKUNIY SUMMA:</div><div class="tv">${fmt(c.final)} so'm</div></div>
        ${(parseFloat(o.kurs)>0) ? `<div class="trow"><div class="tk">Dollarda (1 $ = ${fmt(o.kurs)} so'm):</div><div class="tv">$${fmtUsd(c.final/parseFloat(o.kurs))}</div></div>` : ''}

}
async function makePDF(oid){
  const o=getOrder(oid); if(!o) return;
  toast('PDF tayyorlanmoqda...');
  try{
    await ensurePdfLibs();
    const IMGS={};
    for(const r of o.rooms){ if(r.imgKey){ try{ const d=await idbGet(r.imgKey); if(d) IMGS[r.id]=d; }catch(e){} } }
    const host=document.getElementById('pdfHost');
    host.innerHTML=pdfSheetHTML(o, IMGS);
    await new Promise(r=>setTimeout(r,60));
    const el=document.getElementById('sheetEl');
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const img=canvas.toDataURL('image/jpeg',0.92);
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const imgW=210, pageH=297;
    const imgH=canvas.height*imgW/canvas.width;
    let heightLeft=imgH, position=0;
    pdf.addImage(img,'JPEG',0,position,imgW,imgH);
    heightLeft-=pageH;
    while(heightLeft>0){
      position=heightLeft-imgH;
      pdf.addPage();
      pdf.addImage(img,'JPEG',0,position,imgW,imgH);
      heightLeft-=pageH;
    }
    const cname=(o.client.name||'mijoz').replace(/[^\wЀ-ӿa-zA-Z0-9'-]+/g,'_').slice(0,30);
    const fname=`DormonDoors_zakaz${o.id}_${cname}.pdf`;
    const blob=pdf.output('blob');
    const file=new File([blob],fname,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:fname});
    } else {
      pdf.save(fname);
    }
    host.innerHTML='';
  }catch(e){
    if(e && e.name==='AbortError') return;
    toast('PDF xatosi: '+(e&&e.message?e.message:'internet kerak bo\'lishi mumkin (birinchi marta)'));
  }
}

/* =================== GOOGLE DISK AVTO-ZAXIRA (FINANS sozlamalaridan o'qiydi) =================== */
function gdConf(){
  try{
    const x=JSON.parse(localStorage.getItem('dormon_xarajat_v2'));
    if(x && x.settings && x.settings.gdUrl) return {url:String(x.settings.gdUrl).trim(), token:x.settings.gdToken||'dormon2026'};
  }catch(e){}
  return null;
}
async function gdZakazSend(){
  const cf=gdConf(); if(!cf||!cf.url) return;
  const name='dormon_zakaz_'+todayStr()+'.json';
  const body=JSON.stringify({token:cf.token, name:name, data:JSON.stringify({app:'dormon-zakaz', ver:5, savedAt:todayStr(), state:S})});
  try{
    await fetch(cf.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,redirect:'follow'});
    try{ localStorage.setItem('dormon_zakaz_gdlast', todayStr()); }catch(e){}
  }catch(e){
    try{
      await fetch(cf.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});
      try{ localStorage.setItem('dormon_zakaz_gdlast', todayStr()); }catch(e2){}
    }catch(e3){}
  }
}
function maybeZakazBackup(){
  try{
    if(localStorage.getItem('dormon_zakaz_gdlast')===todayStr()) return;
    if(!S.orders.length) return;
    gdZakazSend();
  }catch(e){}
}

/* =================== PIN HIMOYA (ikkala ilovaga umumiy) =================== */
const PIN_KEY='dormon_pin_v1';
function pinGet(){ try{const r=localStorage.getItem(PIN_KEY); return r?JSON.parse(r):null;}catch(e){return null;} }
function pinSet(){
  const el=document.getElementById('pinNew'); const v=(el&&el.value||'').trim();
  if(!/^\d{4,6}$/.test(v)){ toast("PIN 4–6 ta raqam bo'lsin"); return; }
  try{ localStorage.setItem(PIN_KEY, JSON.stringify({pin:v})); }catch(e){}
  toast("PIN o'rnatildi ✓");
  if(typeof renderSettings==='function') renderSettings(); else if(typeof renderSet==='function') renderSet();
}
function pinOff(){
  localStorage.removeItem(PIN_KEY);
  toast("PIN o'chirildi");
  if(typeof renderSettings==='function') renderSettings(); else if(typeof renderSet==='function') renderSet();
}
function pinLock(){
  const pd=pinGet(); if(!pd||!pd.pin) return;
  if(document.getElementById('pinOv')) return;
  const ov=document.createElement('div');
  ov.id='pinOv';
  ov.style.cssText='position:fixed;inset:0;background:#1F3864;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px';
  ov.innerHTML='<div style="color:#E7B93C;font-family:Georgia,serif;font-size:22px;font-weight:700;letter-spacing:2px">DORMON DOORS</div>'+
   '<div style="color:#C9D3E4;font-family:Arial,sans-serif;font-size:13px">PIN-kodni kiriting</div>'+
   '<input id="pinInp" type="password" inputmode="numeric" maxlength="6" autocomplete="off" style="font-size:26px;text-align:center;letter-spacing:8px;width:190px;padding:12px;border-radius:10px;border:none;background:#FFF6D8">'+
   '<div id="pinErr" style="color:#F0B0A0;font-family:Arial,sans-serif;font-size:12.5px;min-height:16px"></div>'+
   '<button id="pinForgot" style="background:none;border:none;color:#9FB0CC;font-family:Arial,sans-serif;font-size:12.5px;text-decoration:underline;cursor:pointer">PIN esimdan chiqdi</button>';
  document.body.appendChild(ov);
  const inp=document.getElementById('pinInp');
  setTimeout(function(){ try{inp.focus();}catch(e){} },150);
  inp.addEventListener('input',function(){
    const val=inp.value.replace(/\D/g,''); inp.value=val;
    if(val===String(pd.pin)) ov.remove();
    else if(val.length>=String(pd.pin).length){ document.getElementById('pinErr').textContent="Noto'g'ri PIN"; inp.value=''; }
  });
  document.getElementById('pinForgot').addEventListener('click',function(){
    const w=prompt("Google Disk maxfiy so'zini kiriting:");
    if(w===null) return;
    let tok='dormon2026';
    try{ const x=JSON.parse(localStorage.getItem('dormon_xarajat_v2')); if(x&&x.settings&&x.settings.gdToken) tok=x.settings.gdToken; }catch(e){}
    if(String(w).trim()===String(tok)){ localStorage.removeItem(PIN_KEY); ov.remove(); toast("PIN o'chirildi"); }
    else document.getElementById('pinErr').textContent="Maxfiy so'z xato";
  });
}
